# Gera os dados a partir do TSE, monta o site e publica no GitHub Pages.
# Roda todo dia de madrugada, a cada push na main e sob demanda (aba Actions).

name: Publicar site

on:
  push:
    branches: [main]
    # Mudanças que não alteram o site não disparam publicação.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "pipeline/explorar_*.py"
      - ".github/workflows/explorar.yml"
  schedule:
    - cron: "17 8 * * *" # 05:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Eleições passadas não mudam: ficam guardadas entre execuções.
      - name: Recuperar dados do TSE já baixados
        uses: actions/cache@v6
        with:
          path: pipeline/dados_brutos
          key: tse-historico-v1

      # Fotos mudam pouco: guardadas por semana.
      - name: Semana atual
        id: semana
        run: echo "valor=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Recuperar fotos já baixadas
        uses: actions/cache@v6
        with:
          path: pipeline/dados_brutos/fotos
          key: tse-fotos-${{ steps.semana.outputs.valor }}

      # Câmara e Senado: o próprio script decide o que baixar de novo (pela data do arquivo).
      - name: Recuperar dados da Câmara e do Senado
        uses: actions/cache/restore@v6
        with:
          path: pipeline/dados_brutos/parlamento
          key: parlamento-${{ github.run_id }}
          restore-keys: parlamento-

      # A eleição atual muda (situação das candidaturas, resultados): baixa sempre.
      - name: Descartar arquivos da eleição atual
        run: rm -f pipeline/dados_brutos/*_2026.zip

      - name: Gerar dados dos candidatos
        env:
          ALUMIA_CHAVE: ${{ secrets.ALUMIA_CHAVE }}
        run: python pipeline/gerar_pessoas.py

      # Se falhar, o site sai sem a seção do Congresso, mas com o resto atualizado.
      - name: Juntar mandatos na Câmara e no Senado
        continue-on-error: true
        env:
          ALUMIA_CHAVE: ${{ secrets.ALUMIA_CHAVE }}
        run: python pipeline/gerar_parlamento.py

      # Guarda o que foi baixado a cada execução, mesmo se o passo anterior falhar.
      # O GitHub descarta sozinho os caches mais antigos.
      - name: Guardar dados da Câmara e do Senado
        if: always()
        uses: actions/cache/save@v6
        with:
          path: pipeline/dados_brutos/parlamento
          key: parlamento-${{ github.run_id }}

      # Se falhar, o site sai sem a seção de sanções, mas com o resto atualizado.
      - name: Juntar sanções (CGU)
        continue-on-error: true
        env:
          ALUMIA_CHAVE: ${{ secrets.ALUMIA_CHAVE }}
        run: python pipeline/gerar_sancoes.py

      # dados/empresas.json vem do computador local (ferramentas/atualizar_empresas.ps1).
      - name: Juntar empresas (Receita Federal)
        continue-on-error: true
        run: python pipeline/juntar_empresas.py

      - name: Gerar fotos dos candidatos
        run: |
          pip install pillow
          python pipeline/gerar_fotos.py

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Montar o site
        working-directory: site
        env:
          ALUMIA_SITE: ${{ steps.pages.outputs.origin }}
          ALUMIA_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
