# Roda um comando de exploração de dados no GitHub, sob demanda (aba Actions).
# A saída fica no arquivo saida.txt do ramo "exploracao", separado do código.

name: Explorar dados

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando a rodar (ex.: python pipeline/explorar_parlamento.py)"
        required: true
        default: python pipeline/explorar_parlamento.py

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Reaproveita os dados já baixados pela publicação (só leitura).
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/dados_brutos
          key: tse-historico-v1
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/dados_brutos/parlamento
          key: parlamento-
          restore-keys: parlamento-
      - name: Rodar
        env:
          ALUMIA_CHAVE: ${{ secrets.ALUMIA_CHAVE }}
        run: bash -c "${{ inputs.comando }}" 2>&1 | tee /tmp/saida.txt
      - name: Guardar a saída no ramo exploracao
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan exploracao
          git rm -rq --cached .
          cp /tmp/saida.txt saida.txt
          git add saida.txt
          git commit -qm "Saída da exploração"
          git push -qf origin exploracao
