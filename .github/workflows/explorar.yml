# Roda um script de exploração de dados no GitHub, sob demanda (aba Actions).
# A saída fica no arquivo saida.txt do ramo "exploracao", separado do código.

name: Explorar dados

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script em pipeline/ (ex.: explorar_parlamento.py)"
        required: true
        default: explorar_parlamento.py

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rodar
        run: python "pipeline/${{ inputs.script }}" 2>&1 | tee /tmp/saida.txt
      - name: Guardar a saída no ramo exploracao
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan exploracao
          git rm -rq --cached .
          cp /tmp/saida.txt saida.txt
          git add saida.txt
          git commit -qm "Saída de ${{ inputs.script }}"
          git push -qf origin exploracao
